name: Build Host Android APK (arm64-v8a, targetSdk 28)

on:
  push:
    paths:
      - "android/**"
      - "native/**"
      - "include/**"
      - ".github/workflows/build-host-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "native/**"
      - "include/**"
      - ".github/workflows/build-host-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Locate Android NDK & cross-compile native binaries (arm64-v8a)
        run: |
          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "Using Android NDK: $NDK_PATH"

          cmake -S native -B build-android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_PATH}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-31 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-android-arm64 -j$(nproc)

          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp build-android-arm64/guest_runner android/app/src/main/jniLibs/arm64-v8a/libguest_runner.so
          cp build-android-arm64/vguest_fb_demo android/app/src/main/jniLibs/arm64-v8a/libvguest_fb_demo.so
          cp build-android-arm64/libvguest_display.so android/app/src/main/jniLibs/arm64-v8a/libvguest_display.so
          ls -lh android/app/src/main/jniLibs/arm64-v8a/

      - name: Cache SwiftShader GLES (arm64-v8a)
        id: cache-swiftshader
        uses: actions/cache@v4
        with:
          path: swiftshader-out
          key: swiftshader-gles-arm64-v8a-android12-r1

      - name: Build SwiftShader OpenGL ES (arm64-v8a)
        if: steps.cache-swiftshader.outputs.cache-hit != 'true'
        run: |
          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n 1)
          fi
          git clone --branch android-12.1.0_r27 --depth 1             https://android.googlesource.com/platform/external/swiftshader swiftshader-src
          cmake -S swiftshader-src -B swiftshader-build             -DCMAKE_TOOLCHAIN_FILE="${NDK_PATH}/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-31             -DCMAKE_BUILD_TYPE=Release             -DSWIFTSHADER_BUILD_EGL=ON             -DSWIFTSHADER_BUILD_GLESv2=ON             -DSWIFTSHADER_BUILD_GLES_CM=ON             -DSWIFTSHADER_BUILD_VULKAN=OFF             -DSWIFTSHADER_BUILD_TESTS=OFF             -DSWIFTSHADER_BUILD_SAMPLES=OFF             -DREACTOR_BACKEND=Subzero
          cmake --build swiftshader-build --target libEGL libGLESv2 libGLESv1_CM -j$(nproc)
          mkdir -p swiftshader-out
          STRIP="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          cp $(find swiftshader-build -name "libEGL.so" | head -n 1) swiftshader-out/libEGL_swiftshader.so
          cp $(find swiftshader-build -name "libGLESv1_CM.so" | head -n 1) swiftshader-out/libGLESv1_CM_swiftshader.so
          cp $(find swiftshader-build -name "libGLESv2.so" | head -n 1) swiftshader-out/libGLESv2_swiftshader.so
          "$STRIP" --strip-unneeded swiftshader-out/*.so

      - name: Bundle SwiftShader EGL/GLES into jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp swiftshader-out/libEGL_swiftshader.so android/app/src/main/jniLibs/arm64-v8a/
          cp swiftshader-out/libGLESv1_CM_swiftshader.so android/app/src/main/jniLibs/arm64-v8a/
          cp swiftshader-out/libGLESv2_swiftshader.so android/app/src/main/jniLibs/arm64-v8a/
          ls -lh android/app/src/main/jniLibs/arm64-v8a/

      - name: Build Debug APK
        run: |
          gradle -p android assembleDebug --no-daemon
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload sideloadable Host APK
        uses: actions/upload-artifact@v4
        with:
          name: vguest-host-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

name: Build Host Android APK (arm64-v8a, targetSdk 28)

on:
  push:
    paths:
      - "android/**"
      - "native/**"
      - "include/**"
      - "tools/ci_build_graphics_hals.sh"
      - ".github/workflows/build-host-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "native/**"
      - "include/**"
      - "tools/ci_build_graphics_hals.sh"
      - ".github/workflows/build-host-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Locate Android NDK & cross-compile native binaries (arm64-v8a)
        run: |
          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "Using Android NDK: $NDK_PATH"

          cmake -S native -B build-android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_PATH}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-31 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-android-arm64 -j$(nproc)

          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp build-android-arm64/guest_runner android/app/src/main/jniLibs/arm64-v8a/libguest_runner.so
          cp build-android-arm64/vguest_fb_demo android/app/src/main/jniLibs/arm64-v8a/libvguest_fb_demo.so
          cp build-android-arm64/libvguest_display.so android/app/src/main/jniLibs/arm64-v8a/libvguest_display.so
          cp build-android-arm64/libvguest_gralloc.so android/app/src/main/jniLibs/arm64-v8a/libvguest_gralloc.so
          ls -lh android/app/src/main/jniLibs/arm64-v8a/

      - name: Cache SwiftShader GLES (arm64-v8a)
        id: cache-swiftshader
        uses: actions/cache@v4
        with:
          path: swiftshader-out
          key: swiftshader-gles-arm64-v8a-llvm-r1

      - name: Build SwiftShader OpenGL ES (arm64-v8a)
        if: steps.cache-swiftshader.outputs.cache-hit != 'true'
        run: |
          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n 1)
          fi
          git clone --branch android-12.1.0_r27 --depth 1 \
            https://android.googlesource.com/platform/external/swiftshader swiftshader-src
          git clone --branch android-12.1.0_r27 --depth 1 --filter=blob:none --sparse \
            https://android.googlesource.com/platform/system/core aosp-core && \
            git -C aosp-core sparse-checkout set libcutils libsystem libsync include
          git clone --branch android-12.1.0_r27 --depth 1 --filter=blob:none --sparse \
            https://android.googlesource.com/platform/system/logging aosp-logging && \
            git -C aosp-logging sparse-checkout set liblog
          git clone --branch android-12.1.0_r27 --depth 1 \
            https://android.googlesource.com/platform/hardware/libhardware aosp-hw
          git clone --branch android-12.1.0_r27 --depth 1 --filter=blob:none --sparse \
            https://android.googlesource.com/platform/frameworks/native aosp-native && \
            git -C aosp-native sparse-checkout set libs/nativewindow libs/nativebase libs/arect libs/ui include

          echo '=== Discovered AOSP headers ==='
          find aosp-core aosp-logging aosp-hw aosp-native -name 'native_handle.h' -o -name 'window.h' -o -name 'gralloc.h' | head -n 20
          AOSP_INC_DIRS=$(find "${PWD}/aosp-core" "${PWD}/aosp-logging" "${PWD}/aosp-hw" "${PWD}/aosp-native" -maxdepth 4 -type d -name 'include*' | tr '\n' ' ')
          echo "include_directories(SYSTEM ${AOSP_INC_DIRS})" > "${PWD}/swiftshader-aosp-inc.cmake"

          cmake -S swiftshader-src -B swiftshader-build \
            -DCMAKE_PROJECT_INCLUDE="${PWD}/swiftshader-aosp-inc.cmake" \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_PATH}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-31 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSWIFTSHADER_BUILD_EGL=ON \
            -DSWIFTSHADER_BUILD_GLESv2=ON \
            -DSWIFTSHADER_BUILD_GLES_CM=ON \
            -DSWIFTSHADER_BUILD_VULKAN=OFF \
            -DSWIFTSHADER_BUILD_TESTS=OFF \
            -DREACTOR_BACKEND=LLVM \
            -DSWIFTSHADER_WARNINGS_AS_ERRORS=OFF \
            -DCMAKE_CXX_FLAGS="-Wno-error -Wno-unused-but-set-variable -Wno-deprecated-declarations" \
            -DCMAKE_C_FLAGS="-Wno-error" \
            -DCMAKE_SHARED_LINKER_FLAGS="-landroid -llog -Wl,--allow-shlib-undefined -Wl,--unresolved-symbols=ignore-all"
          cmake --build swiftshader-build --target gl_main -j$(nproc)
          cmake --build swiftshader-build --target libEGL libGLESv2 libGLES_CM -j$(nproc)
          mkdir -p swiftshader-out
          STRIP="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          cp $(find swiftshader-build -maxdepth 3 -name "libEGL*.so" | head -n 1) swiftshader-out/libEGL_swiftshader.so
          cp $(find swiftshader-build -maxdepth 3 -name "libGLES*CM*.so" | head -n 1) swiftshader-out/libGLESv1_CM_swiftshader.so
          cp $(find swiftshader-build -maxdepth 3 -name "libGLESv2*.so" | head -n 1) swiftshader-out/libGLESv2_swiftshader.so
          "$STRIP" --strip-unneeded swiftshader-out/*.so

      - name: Cache AOSP 12 Graphics HALs (arm64-v8a)
        id: cache-graphics-hals
        uses: actions/cache@v4
        with:
          path: graphics-hals-out
          key: aosp12-graphics-hals-arm64-v8a-r1-${{ hashFiles('native/src/vguest_hwcomposer.cpp', 'tools/ci_build_graphics_hals.sh') }}

      - name: Build AOSP 12 Graphics HALs (HWC2, Composer@2.1, Allocator@2.0, Mapper@2.0)
        if: steps.cache-graphics-hals.outputs.cache-hit != 'true'
        run: bash tools/ci_build_graphics_hals.sh

      - name: Bundle SwiftShader & Graphics HALs into jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp swiftshader-out/libEGL_swiftshader.so android/app/src/main/jniLibs/arm64-v8a/
          cp swiftshader-out/libGLESv1_CM_swiftshader.so android/app/src/main/jniLibs/arm64-v8a/
          cp swiftshader-out/libGLESv2_swiftshader.so android/app/src/main/jniLibs/arm64-v8a/
          cp graphics-hals-out/libvguest_hwcomposer.so android/app/src/main/jniLibs/arm64-v8a/
          cp graphics-hals-out/libvguest_mapper20_impl.so android/app/src/main/jniLibs/arm64-v8a/
          cp graphics-hals-out/libvguest_allocator20_svc.so android/app/src/main/jniLibs/arm64-v8a/
          cp graphics-hals-out/libvguest_composer21_svc.so android/app/src/main/jniLibs/arm64-v8a/
          ls -lh android/app/src/main/jniLibs/arm64-v8a/

      - name: Build Debug APK
        run: |
          gradle -p android assembleDebug --no-daemon
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload sideloadable Host APK
        uses: actions/upload-artifact@v4
        with:
          name: vguest-host-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
